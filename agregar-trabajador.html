<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nuevo Trabajador - Construction App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d6cf2",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101722",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 py-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-900 dark:text-slate-100 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-xl font-bold text-slate-900 dark:text-slate-100 tracking-tight">Nuevo Trabajador</h1>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 max-w-md mx-auto w-full px-4 py-6 space-y-8 pb-32">
<!-- Nickname Input Section -->
<section class="space-y-2">
<label class="block">
<span class="text-sm font-bold text-primary uppercase tracking-wider">Identificador Principal</span>
<p class="text-lg font-semibold text-slate-900 dark:text-slate-100 mb-2">Apodo</p>
<input class="w-full h-16 px-4 text-xl font-medium rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-0 transition-all placeholder:text-slate-400 dark:placeholder:text-slate-500 shadow-sm" placeholder="Ej. El Maestro, Junior, Eléctrico" required="" type="text"/>
<p class="mt-2 text-sm text-slate-500 dark:text-slate-400 flex items-center gap-1">
<span class="material-symbols-outlined text-sm">info</span>
                    Este nombre aparecerá en las planillas diarias.
                </p>
</label>
</section>
<!-- Full Name Input Section -->
<section class="space-y-2">
<label class="block">
<span class="text-sm font-semibold text-slate-600 dark:text-slate-400">Nombre completo (Opcional)</span>
<input class="mt-2 w-full h-14 px-4 text-base rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-0 transition-all placeholder:text-slate-400" placeholder="Nombre y apellidos" type="text"/>
</label>
</section>
<!-- Daily Rate Section -->
<section class="space-y-2">
<label class="block">
<span class="text-sm font-semibold text-slate-600 dark:text-slate-400">Tarifa por día</span>
<div class="mt-2 relative flex items-center">
<span class="absolute left-4 text-slate-500 dark:text-slate-400 font-bold text-lg">RD$</span>
<input class="w-full h-16 pl-16 pr-4 text-xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-0 transition-all shadow-sm" placeholder="0.00" type="number"/>
</div>
</label>
</section>
<!-- Worker Type Section -->
<section class="space-y-4">
<span class="text-sm font-semibold text-slate-600 dark:text-slate-400">Tipo de trabajador</span>
<div class="grid grid-cols-2 gap-3">
<!-- Option 1: Fijo -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="tipo_trabajador" type="radio" value="fijo"/>
<div class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 peer-checked:border-primary peer-checked:bg-primary/5 transition-all group-hover:bg-slate-50 dark:group-hover:bg-slate-700/50">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 peer-checked:text-primary mb-2 text-3xl">calendar_today</span>
<span class="font-bold text-slate-900 dark:text-slate-100">Fijo</span>
<span class="text-xs text-slate-500 dark:text-slate-400 mt-1">Sueldo recurrente</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100">
<span class="material-symbols-outlined text-primary text-xl">check_circle</span>
</div>
</label>
<!-- Option 2: Por días -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="tipo_trabajador" type="radio" value="por_dias"/>
<div class="flex flex-col items-center justify-center p-4 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 peer-checked:border-primary peer-checked:bg-primary/5 transition-all group-hover:bg-slate-50 dark:group-hover:bg-slate-700/50">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 peer-checked:text-primary mb-2 text-3xl">timer</span>
<span class="font-bold text-slate-900 dark:text-slate-100">Por días</span>
<span class="text-xs text-slate-500 dark:text-slate-400 mt-1">Pago por jornada</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100">
<span class="material-symbols-outlined text-primary text-xl">check_circle</span>
</div>
</label>
</div>
</section>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 p-4 pb-8 md:pb-4 flex justify-center z-50">
<div class="max-w-md w-full">
<button class="w-full bg-primary hover:bg-blue-600 active:scale-[0.98] text-white font-bold text-lg py-5 rounded-xl shadow-lg shadow-primary/30 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">person_add</span>
                Guardar Trabajador
            </button>
</div>
</footer>
<!-- Helpful Tips Card (Extra UI element for construction context) -->
<div class="hidden md:block fixed right-8 top-32 max-w-[240px]">
<div class="bg-primary/10 border border-primary/20 p-4 rounded-xl">
<h4 class="text-primary font-bold text-sm mb-2 flex items-center gap-2">
<span class="material-symbols-outlined text-lg">lightbulb</span>
                Consejo rápido
            </h4>
<p class="text-xs text-slate-700 dark:text-slate-300 leading-relaxed">
                Asignar un apodo claro ayuda a los capataces a encontrar al personal más rápido durante el pase de lista diario.
            </p>
</div>
</div>
</body></html>
