<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0d6cf2",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101722",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        /* Custom styles to simulate iOS Bottom Sheet behavior and scrollbar hiding */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-800 flex items-center justify-center min-h-screen p-0 sm:p-4">
<!-- Mobile Device Simulator Container -->
<div class="relative w-full max-w-md h-[812px] bg-background-light dark:bg-background-dark overflow-hidden sm:rounded-[3rem] shadow-2xl border-8 border-gray-900">
<!-- Status Bar Simulator -->
<div class="absolute top-0 w-full h-12 flex justify-between items-center px-6 z-20 text-gray-900 dark:text-white">
<span class="text-sm font-semibold">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-icons text-[16px]">signal_cellular_alt</span>
<span class="material-icons text-[16px]">wifi</span>
<span class="material-icons text-[16px]">battery_full</span>
</div>
</div>
<!-- Background Content (Blurred to simulate focus on bottom sheet) -->
<div class="h-full w-full pt-20 px-4 pb-4 opacity-30 pointer-events-none filter blur-[1px]">
<div class="flex items-center gap-3 mb-6">
<div class="w-12 h-12 rounded-full bg-gray-300 dark:bg-gray-700 overflow-hidden">
<img alt="Construction worker portrait" class="w-full h-full object-cover" data-alt="Portrait of a smiling construction worker wearing a yellow hard hat" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCgoHSS7GzFfZbMDrQRoskpZhXcmiM14RnHd5rn7ll9rS3ZeaBiFWk39WIkxRg2wKC-CMQk6EzOa52tegcnfxMdSgfOGaOy_2if6jPz-Lk7YWa524lSBMD6dhwGSqrCjYBw0ZS0KJCKtZ8XunKnseuWZwyMH0KLMDN1F69g1SzYUSCQX6YA4jwMcipOi5ly6IQjdfax4disymQNei8ande3TaszEVDAyZ_mOMglYuK4dZ_UJ--5uE0nLHXx6Zl172poNls6Yg09U3A"/>
</div>
<div>
<h2 class="text-xl font-bold text-gray-900 dark:text-white">Carlos Rodriguez</h2>
<p class="text-sm text-gray-500 dark:text-gray-400">Albañil • Sitio: Torre Blue</p>
</div>
</div>
<div class="space-y-4">
<div class="h-24 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700"></div>
<div class="h-24 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700"></div>
<div class="h-24 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700"></div>
</div>
</div>
<!-- Overlay/Scrim -->
<div class="absolute inset-0 bg-black/40 z-30"></div>
<!-- Bottom Sheet -->
<div class="absolute bottom-0 left-0 w-full bg-white dark:bg-gray-900 rounded-t-3xl shadow-xl z-40 transform transition-transform duration-300 ease-out flex flex-col max-h-[90%]">
<!-- Handle -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
</div>
<!-- Header -->
<div class="px-6 py-3 flex justify-between items-center border-b border-gray-100 dark:border-gray-800">
<h2 class="text-xl font-bold text-gray-900 dark:text-white">Agregar extra</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
<span class="material-icons text-xl">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto hide-scrollbar p-6 space-y-6">
<!-- Quick Amount Grid -->
<div>
<label class="block text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3 uppercase tracking-wider">Monto Rápido</label>
<div class="grid grid-cols-2 gap-3">
<button class="group relative flex flex-col items-center justify-center py-4 px-2 bg-background-light dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl hover:border-primary hover:bg-primary/5 active:bg-primary/10 transition-all duration-200">
<span class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-0.5">Bono pequeño</span>
<span class="text-lg font-bold text-gray-900 dark:text-white group-hover:text-primary transition-colors">+RD$100</span>
</button>
<button class="group relative flex flex-col items-center justify-center py-4 px-2 bg-background-light dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl hover:border-primary hover:bg-primary/5 active:bg-primary/10 transition-all duration-200">
<span class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-0.5">Dieta</span>
<span class="text-lg font-bold text-gray-900 dark:text-white group-hover:text-primary transition-colors">+RD$200</span>
</button>
<button class="group relative flex flex-col items-center justify-center py-4 px-2 bg-primary text-white border border-primary rounded-xl shadow-md shadow-primary/20 transform scale-[1.02] transition-all duration-200 ring-2 ring-primary ring-offset-2 dark:ring-offset-gray-900">
<div class="absolute -top-2 -right-2 bg-yellow-400 text-yellow-900 text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">POPULAR</div>
<span class="text-xs font-medium text-white/80 mb-0.5">Medio día</span>
<span class="text-lg font-bold text-white">+RD$500</span>
<span class="material-icons absolute bottom-2 right-2 text-white/20 text-sm">check_circle</span>
</button>
<button class="group relative flex flex-col items-center justify-center py-4 px-2 bg-background-light dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl hover:border-primary hover:bg-primary/5 active:bg-primary/10 transition-all duration-200">
<span class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-0.5">Día completo</span>
<span class="text-lg font-bold text-gray-900 dark:text-white group-hover:text-primary transition-colors">+RD$1,000</span>
</button>
</div>
<!-- Other Button / Manual Toggle -->
<button class="mt-3 w-full py-3 flex items-center justify-center gap-2 text-primary font-medium bg-primary/10 hover:bg-primary/20 rounded-lg transition-colors border border-transparent hover:border-primary/20">
<span class="material-icons text-sm">edit</span>
<span>Otro monto</span>
</button>
</div>
<!-- Input Section -->
<div class="space-y-5">
<!-- Amount Input -->
<div class="relative">
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2" for="amount">Monto Total</label>
<div class="relative rounded-xl shadow-sm">
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
<span class="text-gray-500 dark:text-gray-400 font-bold text-lg">RD$</span>
</div>
<input class="block w-full rounded-xl border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 pl-14 py-4 pr-4 text-2xl font-bold text-gray-900 dark:text-white placeholder-gray-300 focus:border-primary focus:ring-primary focus:ring-2 transition-all" id="amount" name="amount" placeholder="0.00" type="number" value="500"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-4">
<span class="text-gray-400 text-sm">DOP</span>
</div>
</div>
</div>
<!-- Note Input -->
<div>
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2" for="note">
                            Nota <span class="text-gray-400 font-normal">(opcional)</span>
</label>
<div class="relative">
<textarea class="block w-full rounded-xl border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 py-3 px-4 text-gray-900 dark:text-white placeholder-gray-400 focus:border-primary focus:ring-primary focus:ring-2 resize-none transition-all text-base" id="note" name="note" placeholder="Ej. Pasaje, almuerzo, horas extra..." rows="3"></textarea>
<div class="absolute bottom-2 right-2">
<span class="material-icons text-gray-300 text-lg">edit_note</span>
</div>
</div>
</div>
</div>
</div>
<!-- Footer CTA -->
<div class="p-6 border-t border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 pb-10"> <!-- Extra padding for Home Indicator -->
<button class="w-full flex items-center justify-center gap-2 rounded-xl bg-primary px-6 py-4 text-lg font-bold text-white shadow-lg shadow-primary/30 hover:bg-blue-600 active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-gray-900" type="button">
<span class="material-icons">save</span>
                    Guardar Extra
                </button>
</div>
</div>
<!-- iOS Home Indicator -->
<div class="absolute bottom-1 left-1/2 transform -translate-x-1/2 w-1/3 h-1.5 bg-gray-900/20 dark:bg-white/20 rounded-full z-50 pointer-events-none"></div>
</div>
